[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgb-tof-fusion"
version = "0.1.0"
description = "RGB-guided ToF depth completion, evaluation, and reconstruction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "Pillow>=10.0", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
